<!doctype html>
<html lang="el">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Μαθήματα</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f5fb; color: #1e1b2e;
        font-family: -apple-system, system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      .logo { width: 72px; height: 72px; border-radius: 18px; background: linear-gradient(135deg, #7c3aed, #c026d3 55%, #ec4899); margin: 0 auto 20px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #6b6880; margin: 0 0 24px; }
      button { font: inherit; font-weight: 600; color: #fff; background: #7c3aed; border: 0; border-radius: 12px; padding: 12px 28px; }
    </style>
  </head>
  <body>
    <div>
      <div class="logo"></div>
      <h1>Δεν υπάρχει σύνδεση</h1>
      <p>Ελέγξτε το internet και δοκιμάστε ξανά.</p>
      <!-- keep in sync with server.url in capacitor.config.ts -->
      <button onclick="location.href = 'https://student-calendar-nu.vercel.app/'">Δοκιμή ξανά</button>
    </div>
  </body>
</html>
